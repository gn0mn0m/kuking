html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  font-family: var(--f-body); font-size: clamp(16px, 0.55vw + 13px, 20px); line-height: 1.5;
  color: var(--fg);
  background:
    radial-gradient(1100px 620px at 88% -12%, color-mix(in srgb, var(--orange) 15%, transparent), transparent 62%),
    radial-gradient(900px 520px at -8% 112%, color-mix(in srgb, var(--green) 11%, transparent), transparent 60%),
    var(--bg);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, label:focus-within { outline: 2px solid var(--orange); outline-offset: 2px; }
button:disabled { opacity: .35; cursor: default; }

#app {
  height: 100%; display: grid; grid-template-rows: auto 1fr auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---- ProgressBar ---- */
.top { padding-block: 6px 4px; }
.progress { display: flex; gap: 4px; }
.pb-seg { flex: 1; min-width: 0; padding: 8px 0; background: none; border: 0; }
.pb-track { display: block; height: 5px; border-radius: 5px; overflow: hidden; background: color-mix(in srgb, var(--fg) 16%, transparent); transition: box-shadow .3s ease-out; }
.pb-fill { display: block; height: 100%; background: var(--orange); transform: scaleX(0); transform-origin: left; transition: transform .3s ease-out, opacity .3s ease-out; }
.pb-seg.done .pb-fill { transform: scaleX(1); opacity: .7; }
.pb-seg.current .pb-fill { transform: scaleX(1); opacity: 1; }
.pb-seg.current .pb-track { box-shadow: 0 0 12px color-mix(in srgb, var(--orange) 70%, transparent); }
.pb-seg:hover .pb-track { background: color-mix(in srgb, var(--fg) 26%, transparent); }

.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 2px 6px; }
.brand { font-family: var(--f-display); font-size: 1.05rem; color: var(--orange); margin-right: auto; white-space: nowrap; }
.modes, .guests { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.mode-btn { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: .82rem; font-weight: 600; color: var(--muted); transition: background-color .25s, color .25s; }
.mode-btn[aria-pressed="true"] { background: var(--burgundy); color: var(--on-burgundy); }
.guests { gap: 2px; }
.guests button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 1.2rem; line-height: 1; }
.guests output { font-family: var(--f-mono); font-weight: 700; font-size: 1.1rem; min-width: 1.6em; text-align: center; color: var(--orange); font-variant-numeric: tabular-nums; }
.guests .gl { font-size: .78rem; color: var(--muted); padding-right: 6px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
@media (max-width: 560px) { .brand { display: none; } .mode-btn { padding: 6px 9px; font-size: .76rem; } .guests .gl { display: none; } }

/* ---- Stage / SlideTransition ---- */
.stage { position: relative; overflow: hidden; min-height: 0; }
.slide { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; will-change: transform, opacity; }
.slide-inner { max-width: 1200px; margin: 0 auto; padding-block: 14px 110px; }

.eyebrow { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--green); margin: 0 0 6px; }
.display { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.6rem, 7vw, 5.4rem); line-height: .98; margin: 0 0 14px; text-wrap: balance; }
.display .accent { color: var(--orange); }
.lede { max-width: 62ch; font-size: 1.1em; color: var(--muted); margin: 0 0 18px; }
.step-title { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.8rem, 3.8vw, 2.9rem); line-height: 1.08; margin: 4px 0 14px; text-wrap: balance; }
.step-title .for { font-family: var(--f-mono); font-size: .42em; color: var(--orange); vertical-align: middle; letter-spacing: .04em; }
.label { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0 0 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; min-width: 0; }
.note { background: color-mix(in srgb, var(--green) 14%, transparent); border-radius: 12px; padding: 10px 14px; margin: 0 0 16px; max-width: 72ch; }
.small { font-size: .84rem; color: var(--muted); margin: 10px 0; }
.q { font-family: var(--f-mono); font-weight: 700; color: var(--orange); white-space: nowrap; font-size: .9em; font-variant-numeric: tabular-nums; }

/* cover */
.cover-grid { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 16px; }
@media (max-width: 980px) { .cover-grid { grid-template-columns: 1fr 1fr; } .cover-grid .kbju { grid-column: 1 / -1; } }
@media (max-width: 620px) { .cover-grid { grid-template-columns: 1fr; } }
.menu-list, .phases { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.menu-list li { display: grid; }
.dish { font-weight: 600; }
.dish-desc { font-size: .86rem; color: var(--muted); }
.phases li { display: grid; grid-template-columns: 3.2em 1fr; gap: 8px; align-items: baseline; }
.ph-t { font-family: var(--f-mono); font-weight: 700; color: var(--orange); font-variant-numeric: tabular-nums; }
.kcal { display: flex; align-items: baseline; gap: 8px; }
.kcal-n { font-family: var(--f-display); font-size: 3rem; line-height: 1; color: var(--orange); }
.kcal-u { color: var(--muted); }
.macros { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.mac { font-family: var(--f-mono); font-size: .82rem; font-weight: 700; padding: 4px 10px; border-radius: 8px; }
.mac-p { background: color-mix(in srgb, var(--green) 22%, transparent); color: var(--green); }
.mac-f { background: color-mix(in srgb, var(--burgundy-text) 20%, transparent); color: var(--burgundy-text); }
.mac-c { background: color-mix(in srgb, var(--orange) 20%, transparent); color: var(--orange); }
.kt { width: 100%; border-collapse: collapse; font-size: .82rem; }
.kt td { padding: 4px 0; border-top: 1px dashed var(--line); color: var(--muted); }
.kt td:last-child { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--fg); }
.start-hint { color: var(--muted); font-size: .9rem; margin-top: 18px; }

/* shop */
.shop-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.counter { font-size: 1rem; }
.counter .cn { font-family: var(--f-display); font-size: 1.8rem; color: var(--orange); }
.counter b { color: var(--green); }
.ghost-btn { border: 1px solid var(--line); background: none; border-radius: 10px; padding: 6px 12px; font-size: .82rem; color: var(--muted); }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; align-items: start; }
.item { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 2px; border-bottom: 1px dashed var(--line); cursor: pointer; border-radius: 6px; }
.item:last-child { border-bottom: 0; }
.item input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.box { width: 26px; height: 26px; border: 2px solid var(--muted); border-radius: 7px; display: grid; place-items: center; transition: background-color .2s, border-color .2s; }
.box svg { width: 18px; height: 18px; fill: none; stroke: var(--orange-ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .2s; }
.item input:checked + .box { background: var(--green); border-color: var(--green); }
.item input:checked + .box svg { opacity: 1; }
.item input:checked ~ .nm { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.nm { min-width: 0; }
.am { font-family: var(--f-mono); font-weight: 700; color: var(--orange); white-space: nowrap; font-size: .9rem; text-align: right; font-variant-numeric: tabular-nums; max-width: 16ch; white-space: normal; }
.badge-buy { display: inline-block; margin-left: 8px; font-family: var(--f-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; background: var(--burgundy); color: var(--on-burgundy); padding: 2px 7px; border-radius: 6px; vertical-align: 2px; }

/* tools — карточки «приближаются» к экрану */
.tool-zone { margin-bottom: 18px; }
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.tool-card {
  display: flex; gap: 14px; align-items: center; text-align: left; padding: 14px;
  border-radius: 16px; background: var(--surface); border: 1px solid var(--line);
  transform: perspective(700px) translate3d(0,0,0);
  transition: transform .5s cubic-bezier(.2,.9,.25,1.15), box-shadow .5s cubic-bezier(.2,.8,.2,1), background-color .35s, border-color .35s;
}
.tool-card:hover { border-color: color-mix(in srgb, var(--orange) 45%, var(--line)); }
.tool-card.got {
  transform: perspective(700px) translate3d(0,-4px,46px);
  background: var(--surface-2); border-color: var(--orange);
  box-shadow: 0 22px 44px -16px var(--shadow), 0 0 0 1px var(--orange);
  position: relative; z-index: 1;
}
.tc-ico { flex: none; width: 58px; color: var(--muted); transition: color .35s; }
.tool-card.got .tc-ico { color: var(--orange); }
.ico { width: 100%; height: auto; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.tc-txt { display: grid; gap: 2px; min-width: 0; }
.tc-name { font-weight: 600; justify-self: start; color: var(--fg); padding-bottom: 2px; background: linear-gradient(var(--orange), var(--orange)) left bottom / 0 2px no-repeat; transition: color .35s, background-size .45s cubic-bezier(.2,.8,.2,1), text-shadow .35s; }
.tool-card.got .tc-name { color: var(--orange); background-size: 100% 2px; text-shadow: 0 0 14px color-mix(in srgb, var(--orange) 45%, transparent); }
.tc-use { font-size: .84rem; color: var(--muted); }
.tool-card.got .tc-use { color: var(--fg); }

/* step + lanes */
.step-meta { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font-family: var(--f-mono); font-size: .8rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill-time { background: var(--burgundy); border-color: var(--burgundy); color: var(--on-burgundy); font-weight: 700; }
.lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.lanes.one { grid-template-columns: 1fr; max-width: 900px; }
@media (max-width: 780px) { .lanes { grid-template-columns: 1fr; } }
.lane { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 18px 18px; min-width: 0; }
.lane-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.role { font-family: var(--f-display); font-size: 1.7rem; line-height: 1; }
.lane-chef .role, .lane-you .role { color: var(--orange); }
.lane-sous .role { color: var(--green); }
.lane-both .role { color: var(--burgundy-text); }
.role-sub { font-size: .8rem; color: var(--muted); }
.lane-close { margin-left: auto; border: 1px solid var(--line); background: none; border-radius: 10px; padding: 4px 10px; font-size: .78rem; color: var(--muted); }
.lane-restore { border: 1px dashed var(--orange); background: none; color: var(--orange); border-radius: 12px; padding: 8px 14px; margin: 0 8px 12px 0; font-size: .85rem; font-weight: 600; }
.actions { list-style: none; margin: 0; padding: 0; counter-reset: a; display: grid; gap: 14px; }
.act { counter-increment: a; display: grid; grid-template-columns: 2em minmax(0, 1fr); column-gap: 12px; }
.act::before { content: counter(a); grid-row: 1 / span 3; font-family: var(--f-mono); font-weight: 700; font-size: .82rem; color: var(--muted); width: 2em; height: 2em; border: 1.5px solid var(--line); border-radius: 50%; display: grid; place-items: center; }
.act > * { grid-column: 2; }
.act-text { font-size: 1.06em; line-height: 1.5; }
.act-text strong { font-weight: 700; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--orange) 32%, transparent) 0); }
.act-div { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--green); padding-top: 8px; border-top: 1px dashed var(--line); }
.tool-chip { display: inline-flex; align-items: center; gap: 6px; justify-self: start; margin-top: 6px; font-size: .8rem; color: var(--green); border: 1px solid color-mix(in srgb, var(--green) 45%, transparent); border-radius: 999px; padding: 2px 10px 2px 6px; }
.tool-chip .ico { width: 16px; stroke-width: 3.5; }
.act-timer { margin-top: 10px; }
.joke { margin: 18px 0 0; max-width: 70ch; color: var(--muted); font-style: italic; }
.joke-k { font-style: normal; font-family: var(--f-mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; background: var(--burgundy); color: var(--on-burgundy); padding: 2px 7px; border-radius: 6px; margin-right: 8px; vertical-align: 2px; }

/* ---- RingTimer ---- */
.rt { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; background: var(--surface-2); border-radius: 18px; padding: 14px; border: 1px solid var(--line); transition: border-color .3s; }
.rt-dial { position: relative; width: clamp(132px, 24vw, 176px); aspect-ratio: 1; max-width: 100%; flex: none; }
.rt-dial svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.rt-track { fill: none; stroke: color-mix(in srgb, var(--fg) 12%, transparent); stroke-width: 9; }
.rt-ring { fill: none; stroke: var(--orange); stroke-width: 9; stroke-linecap: round; transition: stroke .4s; }
.rt-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.rt-time { font-family: var(--f-mono); font-weight: 700; font-size: clamp(1.8rem, 4.6vw, 2.5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.rt-label { font-size: .74rem; color: var(--muted); margin-top: 4px; max-width: 9em; }
.rt-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.rt-btns button { min-height: 48px; padding: 0 18px; border-radius: 14px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); }
.rt-go { background: var(--orange) !important; border-color: var(--orange) !important; color: var(--orange-ink); min-width: 7.5em; }
.rt-stop { background: var(--burgundy) !important; border-color: var(--burgundy) !important; color: var(--on-burgundy); letter-spacing: .06em; text-transform: uppercase; }
.rt.running .rt-go { background: var(--surface) !important; border-color: var(--orange) !important; color: var(--orange); }
.rt.warn .rt-ring, .rt.ringing .rt-ring { stroke: var(--alarm); }
.rt.warn .rt-time { color: var(--alarm); }
.rt.warn .rt-dial { animation: rtPulse 1s ease-in-out infinite; }
.rt.ringing { border-color: var(--alarm); animation: rtGlow .9s ease-in-out infinite; }
.rt.ringing .rt-time { color: var(--alarm); }
.rt.ringing .rt-stop { animation: rtPulse .9s ease-in-out infinite; }
@keyframes rtPulse { 50% { transform: scale(1.05); } }
@keyframes rtGlow { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--alarm) 30%, transparent); } }

/* serve */
.serve-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: center; }
@media (max-width: 780px) { .serve-grid { grid-template-columns: 1fr; } }
.serve-fig { margin: 0; }
.plating { width: 100%; max-width: 520px; height: auto; display: block; margin: 0 auto; }
.serve-points { margin: 12px 0 0; padding-left: 1.1em; display: grid; gap: 12px; }
.serve-points li::marker { color: var(--orange); }
.dish-tags { display: flex; gap: 6px; flex-wrap: wrap; }

/* edit mode */
#editBtn[aria-pressed="true"] { background: var(--orange); border-color: var(--orange); color: var(--orange-ink); }
.edit-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; margin-bottom: 6px; border-radius: 12px; background: color-mix(in srgb, var(--orange) 16%, var(--surface)); border: 1px solid var(--orange); font-size: .86rem; }
.edit-bar span { flex: 1 1 260px; min-width: 0; }
.edit-bar .nav-btn { min-height: 40px; padding: 0 16px; }

/* свайпы и меню по удержанию */
.tg-li { position: relative; overflow: hidden; border-radius: 14px; transition: height .25s ease; }

.ctx-ov { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 20px; background: rgba(0,0,0,0); backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0); transition: background .2s, backdrop-filter .2s; }

.undo-toast button { flex: none; border: 0; border-radius: 10px; background: var(--orange); color: var(--orange-ink); font: inherit; font-weight: 700; padding: 8px 12px; }
.soc-chef:not(.adm) { background: none; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }

/* ===== полировка по Apple HIG и Emil Kowalski ===== */
:root { --ease-out: cubic-bezier(.23, 1, .32, 1); --ease-io: cubic-bezier(.77, 0, .175, 1); --ease-drawer: cubic-bezier(.32, .72, 0, 1);
  --sc-top: #3fb24f; --sc-good: #8fc13a; --sc-low: #ff6b4a; --sc-bad: #ff5a5f; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --sc-top: #2a7a36; --sc-good: #5c7d1f; --sc-low: #c0262d; --sc-bad: #a3201f; } }
:root[data-theme="light"] { --sc-top: #2a7a36; --sc-good: #5c7d1f; --sc-low: #c0262d; --sc-bad: #a3201f; }
/* нажатие чувствуется: кнопки чуть проседают, строки списка подсвечиваются, как в iOS */
.nav-btn, .ghost-btn, .tg-chip, .soc-send, .set-tab, .tg-back { transition: transform 160ms var(--ease-out), background-color .2s, color .2s, border-color .2s; }
.nav-btn:active, .ghost-btn:active, .tg-chip:active, .soc-send:active { transform: scale(.97); }
.tg-row { transition: background-color .15s; }
.tg-row:active { background-color: color-mix(in srgb, var(--fg) 7%, var(--bg)); }

/* что нужно на шаге */

.step-need summary { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; list-style: none; }

/* детальная подача */
.plate-grid { align-items: start; }

@media (prefers-reduced-motion: reduce) { .plate-svg .pl-l, .plate-svg .pl-n, .plate-legend li { animation: none; } }
/* назад + главная в шапке готовки */
.back-btn svg { width: 18px; height: 18px; }
.lib-ic { padding: 0; width: 44px; justify-content: center; }
.lib-ic .home-ico { margin: 0; }

/* ===== 3.10 ===== */
/* шторка загрузки: мягко проявляется и растворяется */
#curtain { transition: opacity .5s cubic-bezier(.4,0,.2,1); }
#curtain .cur-in { display: grid; justify-items: center; gap: 14px; transition: transform .6s cubic-bezier(.4,0,.2,1), opacity .5s; }

#curtain .ld-bowl { display: none; }

/* компьютер: панель по центру, а не во всю ширину */
@media (min-width: 700px) { .tg-tabs { left: 0; right: 0; margin: 0 auto; max-width: 520px; } }
/* никакого зума двойным тапом — везде */
*, *::before, *::after { touch-action: manipulation; }
.crop-stage, .crop-stage * { touch-action: none; }
input, select, textarea { font-size: max(16px, 1em); }
/* вкладки: листаются из края в край */

.tg-screen.in-tab-l { animation: tab-l .32s var(--ease-out) both; }

@keyframes tab-l { from { opacity: 0; transform: translateX(-42px); } }
/* пустой день — тапается целиком */
.ag-day.empty .ag-h { cursor: pointer; border-radius: 12px; transition: background-color .2s; }
.ag-day.empty .ag-h:active { background: var(--surface); }
/* время в задаче */
.ts-when { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 10px; }
.ts-when label { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); }
.ts-when input { font: inherit; font-size: 17px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; box-sizing: border-box; }
.ts-when-h { margin: -4px 2px 10px; }
.ps-on { display: inline-flex; align-items: center; gap: 8px; color: var(--green); font-weight: 700; }
.ps-on::before { content: ''; width: 8px; height: 8px; border-radius: 4px; background: var(--green); box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 25%, transparent); }
.ask-box { display: grid; gap: 10px; text-align: center; padding: 6px 4px 4px; }
.ask-box h3 { margin: 6px 0 0; font-size: 1.3rem; }
.ask-box .nav-btn { min-height: 50px; }
/* вход: без дёрганья */
.set-pane { transition: opacity .25s var(--ease-out); }
.set-pane.swap { opacity: 0; }

.td-card.still { animation: none; }
.ts-when-h.ok { color: var(--green); }
.ask-ico { width: 44px; height: 44px; justify-self: center; fill: none; stroke: var(--orange); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* 3.12 — Чаты и Друзья: тот же фон, масштаб и сгруппированные списки, что в Рецептах и Профиле */
.soc-ov { background: radial-gradient(700px 380px at 90% -10%, color-mix(in srgb, var(--orange) 7%, transparent), transparent 65%), var(--bg); }

.soc-ov.scrolled .soc-head2:not(.tg-head-sub) { border-bottom-color: var(--line); }
.soc-ov .tg-mini { padding-left: 0; }
.soc-find { margin: 0 0 14px; }
.soc-sec { margin: 18px 4px 8px; font: 500 .8rem/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.set-ov.page { z-index: 56; display: block; background: radial-gradient(700px 380px at 90% -10%, color-mix(in srgb, var(--orange) 7%, transparent), transparent 65%), var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; opacity: 1; transform: translateX(100%); transition: transform .34s var(--ease-drawer, cubic-bezier(.22,1,.36,1)); overflow-y: auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(var(--tabs-h, 84px) + 40px) max(16px, env(safe-area-inset-left, 0px)); }
.set-ov.page.on { transform: none; }
.set-ov.page .set-panel { width: auto; max-height: none; overflow: visible; background: none; border: 0; border-radius: 0; padding: 0; box-shadow: none; transform: none; margin: 0 auto; max-width: 640px; }
.set-ov.page .set-body { background: var(--surface); border-radius: 18px; padding: 16px; margin-top: 4px; }
.set-ov.page .tg-head { margin-bottom: 14px; }

body:has(.set-ov.page:not([hidden])) .tg-tabs.on { transform: none; opacity: 1; visibility: visible; pointer-events: auto; }

/* 3.14 — «для кого готовим», советы под рацион */
.gs { position: relative; width: min(440px, 100%); display: grid; gap: 14px; padding: 20px 18px 16px; border-radius: 24px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); animation: hall-in .35s cubic-bezier(.34,1.2,.64,1) both; }
.gs .rl-k { margin: 0; }

.gs-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600; }
.gs-step { display: flex; align-items: center; gap: 4px; background: color-mix(in srgb, var(--fg) 7%, transparent); border-radius: 12px; padding: 3px; }
.gs-step button { width: 40px; height: 38px; border: 0; border-radius: 9px; background: none; color: var(--fg); font: 600 1.3rem/1 var(--f-body); }
.gs-step button:disabled { opacity: .3; }
.gs-step button:not(:disabled):active { background: var(--surface); }

.diet ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; line-height: 1.45; }
/* 3.15 — время в плане правится прямо в строке */
.ag-tin { position: relative; display: inline-grid; place-items: center start; min-height: 36px; cursor: pointer; }
.ag-tin span { padding: 4px 6px; margin-left: -6px; border-radius: 8px; border: 1px dashed color-mix(in srgb, var(--muted) 45%, transparent); color: var(--fg); font-variant-numeric: tabular-nums; transition: background-color .2s, border-color .2s; }
.ag-tin:active span, .ag-tin:focus-within span { background: color-mix(in srgb, var(--orange) 16%, transparent); border-color: var(--orange); }
.ag-tin input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; margin: 0; font-size: 16px; -webkit-appearance: none; appearance: none; }

/* 3.16 — без связи с облаком */
.net-pill { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 90; transform: translate(-50%, -140%); display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); box-shadow: 0 10px 30px -12px var(--shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-size: .8rem; color: var(--muted); white-space: nowrap; transition: transform .35s var(--ease-drawer, cubic-bezier(.22,1,.36,1)); pointer-events: none; }
.net-pill.on { transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { .net-pill { transition: opacity .2s; } }
/* 4.0 — дизайн «Журнал» (вариант A): тёплая бумага днём, эспрессо ночью; заголовки Lora, текст Inter */
:root, :root[data-accent] {
  color-scheme: dark;
  --bg: #13100e; --surface: #1c1815; --surface-2: #26201b; --line: #332b25;
  --fg: #f3ebe1; --muted: #a59787; --shadow: rgba(0,0,0,.55);
  --green: #93b87c; --burgundy: #a33a4c; --burgundy-text: #e58a9a; --wine: #5a2a1a;
  --f-display: 'Lora', 'Georgia', 'Times New Roman', serif;
  --f-body: 'Inter', -apple-system, 'SF Pro Text', 'Golos Text', system-ui, sans-serif;
}
:root, :root[data-accent="saffron"] { --orange: #e5845a; --orange-ink: #1d0f08; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]), :root[data-accent]:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f6f0e7; --surface: #fffaf3; --surface-2: #efe5d6; --line: #e6dccd;
    --fg: #1f1712; --muted: #7a6b5f; --shadow: rgba(70,40,20,.22);
    --green: #3f5b3a; --burgundy: #8a2a3c; --burgundy-text: #8a2a3c; --wine: #a8452a;
  }
  :root:not([data-theme="dark"]):not([data-accent]), :root[data-accent="saffron"]:not([data-theme="dark"]) { --orange: #b8522f; --orange-ink: #fffaf3; }
}
:root[data-theme="light"], :root[data-theme="light"][data-accent] {
  color-scheme: light;
  --bg: #f6f0e7; --surface: #fffaf3; --surface-2: #efe5d6; --line: #e6dccd;
  --fg: #1f1712; --muted: #7a6b5f; --shadow: rgba(70,40,20,.22);
  --green: #3f5b3a; --burgundy: #8a2a3c; --burgundy-text: #8a2a3c; --wine: #a8452a;
}
:root[data-theme="light"]:not([data-accent]), :root[data-theme="light"][data-accent="saffron"] { --orange: #b8522f; --orange-ink: #fffaf3; }
/* типографика журнала */
.display, .tg-big, .lib-title, .soc-form-h, .gs-h, .soc-title { font-weight: 600 !important; letter-spacing: -.015em; }
.tg-big { font-size: 2.35rem !important; line-height: 1.08; }
.tg-mini, .tg-head-t, .soc-sec, .tg-sec-t, .ps-l { letter-spacing: .02em; }
.tg-sec-t, .soc-sec { font-family: var(--f-display); text-transform: none; letter-spacing: 0; font-size: 1.15rem; font-weight: 600; color: var(--fg); margin: 22px 4px 10px; }
/* карточки — мягкие, как бумага */
.tg-group, .pf-group, .soc-list.tgl, .td-card, .tg-pin, .set-ov.page .set-body, .soc-nickf { border-radius: 18px; box-shadow: 0 14px 34px -22px var(--shadow); border: 1px solid var(--line); }
.tg-chip { border-radius: 999px; font-weight: 500; }
.tg-chip[aria-pressed="true"] { background: var(--fg) !important; color: var(--bg) !important; border-color: var(--fg) !important; }
.tg-search { border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.nav-btn.primary { border-radius: 16px; }
.tg-tabs { border: 1px solid var(--line); }
.set-theme { margin: 4px 0 16px; }
.about-log { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 12px; }
.about-log li { padding: 12px 14px; border-radius: 14px; background: var(--surface-2); }
.about-log b { font-family: var(--f-display); font-size: 1.02rem; }
.about-log small { color: var(--muted); margin-left: 6px; }
.about-log p { margin: 4px 0 0; font-size: .92rem; line-height: 1.45; color: var(--muted); }
.about-ver { font-family: var(--f-display); font-size: 1.6rem; font-weight: 600; margin: 0; }
/* 4.1 — заставка «Жарко»: огонёк вспыхивает крупно, убегает в значок, слово проявляется буква за буквой */
#curtain .sp { width: min(72vw, 330px); height: auto; overflow: visible; }
#curtain .sp-badge { fill: var(--orange); }
#curtain .sp-word path { fill: var(--fg); }
#curtain .sp-cool { fill: var(--bg); }
#curtain .sp-core { fill: var(--orange); }
#curtain .sp-hot, #curtain .sp-glow { opacity: 0; }
#curtain.anim .sp-move { transform-origin: 46px -22px; animation: sp-move 1.05s cubic-bezier(.65,0,.25,1) both; }
#curtain.anim .sp-ign { transform-origin: 0 20px; animation: sp-ign .62s cubic-bezier(.2,1.4,.4,1) both, sp-flick .5s ease-in-out .62s 2 alternate; }
#curtain.anim .sp-hot { animation: sp-hot 1.05s ease both; }
#curtain.anim .sp-glow { animation: sp-glow 1.1s ease both; }
#curtain.anim .sp-cool, #curtain.anim .sp-core { animation: sp-in .3s ease .82s both; }
#curtain.anim .sp-badge { transform-origin: 46px -24px; animation: sp-badge .42s cubic-bezier(.2,1.3,.4,1) .7s both; }
#curtain.anim .sp-l { animation: sp-letter .46s cubic-bezier(.2,.9,.3,1) both; animation-delay: calc(1.05s + var(--i) * 90ms); }
@keyframes sp-move { 0%, 52% { transform: translate(153px, -2px) scale(2.5); } 100% { transform: none; } }
@keyframes sp-ign { from { transform: scale(.15); } to { transform: none; } }
@keyframes sp-flick { to { transform: scaleY(1.07) scaleX(.95) rotate(-2deg); } }
@keyframes sp-hot { 0% { opacity: 0; } 15%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes sp-glow { 0% { opacity: 0; } 30%, 60% { opacity: 1; } 100% { opacity: 0; } }
@keyframes sp-in { from { opacity: 0; } }
@keyframes sp-badge { from { transform: scale(0); } }

.qz-foot{padding:10px 18px 0;display:flex;flex-direction:column;gap:6px}

<script>
/* обновления: проверяем при запуске, при возврате в приложение и раз в 20 минут.
   Новая версия ставится сама; если ты не в процессе готовки — тихо перезагружаемся за шторкой, иначе — плашка. */
(function () {
  if (!('serviceWorker' in navigator)) { window.kUpdate = function () { return Promise.resolve(false); }; return; }
  var reg = null, had = !!navigator.serviceWorker.controller, reloading = false, last = 0;
  function busy() { var c = document.getElementById('library'); return (c && c.hidden) || !!document.querySelector('input:focus, textarea:focus'); }
  function curtainReload() {
    if (reloading) return; reloading = true;
    try { sessionStorage.setItem('kuking:curtain', '1'); if (window.__kSaveTab) window.__kSaveTab(); } catch (e) {}
    var c = document.getElementById('curtain'); if (c) { c.hidden = false; requestAnimationFrame(function () { c.classList.add('on'); }); }
    setTimeout(function () { location.reload(); }, 240);
  }
  function offer() {
    if (document.querySelector('.upd-toast')) return;
    var t = document.createElement('button'); t.type = 'button'; t.className = 'upd-toast'; t.textContent = 'Вышла новая версия — тапни, обновлю';
    t.addEventListener('click', curtainReload); document.body.appendChild(t);
  }
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!had) { had = true; return; }  // первая установка — перезагружать нечего
    if (window.__kWantReload || !busy()) curtainReload(); else offer();
  });
  function check() {
    if (!reg || Date.now() - last < 5000) return Promise.resolve(); last = Date.now();
    return reg.update().catch(function () {}).then(function () { if (reg.waiting) reg.waiting.postMessage('skip'); });
  }
  /* потянул вниз: если есть свежак — ставим и перезагружаемся, нет — просто перезагрузка */
  window.kUpdate = function () {
    window.__kWantReload = true; last = 0;
    var t = setTimeout(curtainReload, 2500);
    return check().then(function () {
      var w = reg && (reg.installing || reg.waiting);
      if (!w) { clearTimeout(t); curtainReload(); }
    });
  };
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (r) { reg = r; check(); }).catch(function () {});
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(function () { if (!document.hidden) check(); }, 20 * 60 * 1000);
})();
</script>
